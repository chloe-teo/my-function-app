<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end Azure Function App delivery architecture</title>
  <desc id="desc">Azure DevOps builds and deploys the C# function code to Azure Functions, which uses private Blob Storage and Key Vault through private endpoints and reports to Application Insights.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f4f3"/></linearGradient>
    <linearGradient id="azure" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0788c5"/><stop offset="1" stop-color="#075985"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#164e63" flood-opacity=".14"/></filter>
    <marker id="blueArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#087fbd"/></marker>
    <marker id="orangeArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#d97706"/></marker>
    <marker id="greenArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#16805b"/></marker>
    <style>
      .title { font: 700 31px 'Segoe UI',sans-serif; fill:#0f172a; }
      .h { font: 700 19px 'Segoe UI',sans-serif; fill:#0f172a; }
      .hSmall { font: 700 16px 'Segoe UI',sans-serif; fill:#0f172a; }
      .p { font: 400 16px 'Segoe UI',sans-serif; fill:#475569; }
      .micro { font: 700 13px 'Segoe UI',sans-serif; fill:#64748b; letter-spacing:1.5px; }
      .white { font: 700 15px 'Segoe UI',sans-serif; fill:#fff; letter-spacing:1.5px; }
      .iconText { font: 700 25px 'Segoe UI',sans-serif; fill:#fff; text-anchor:middle; }
      .hSmall { font: 700 16px 'Segoe UI',sans-serif; fill:#0f172a; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1450" cy="55" r="215" fill="#ccebe5" opacity=".58"/><circle cx="75" cy="850" r="175" fill="#d8edf5" opacity=".65"/>
  <text x="80" y="72" class="micro">END-TO-END DELIVERY BLUEPRINT</text><text x="80" y="119" class="title">Azure Function App: from code to runtime</text><text x="80" y="152" class="p">Azure DevOps builds and deploys the C# workload into a protected Azure runtime.</text>

  <rect x="70" y="210" width="320" height="500" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/><rect x="70" y="210" width="320" height="55" rx="18" fill="#334155"/><rect x="70" y="245" width="320" height="20" fill="#334155"/><text x="100" y="246" class="white">APPLICATION SOURCE</text>
  <g transform="translate(105 305)"><rect width="64" height="64" rx="14" fill="#24292f"/><text x="32" y="43" class="iconText">&lt;/&gt;</text></g><text x="190" y="330" class="h">C# function code</text><text x="190" y="358" class="p">Source is stored in Git</text><text x="190" y="382" class="p">for the deployment pipeline</text>
  <g transform="translate(105 430)"><polygon points="32,0 60,16 60,48 32,64 4,48 4,16" fill="#7c3aed"/><text x="32" y="42" class="iconText">T</text></g><text x="190" y="455" class="h">Terraform modules</text><text x="190" y="483" class="p">Azure platform resources</text><text x="190" y="507" class="p">used by the application</text>
  <text x="105" y="590" class="micro">APPLICATION FOUNDATION</text><text x="105" y="620" class="p">Function App, storage, network,</text><text x="105" y="645" class="p">identity and monitoring</text>

  <rect x="510" y="210" width="320" height="500" rx="18" fill="#fff" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/><rect x="510" y="210" width="320" height="55" rx="18" fill="#d97706"/><rect x="510" y="245" width="320" height="20" fill="#d97706"/><text x="540" y="246" class="white">CONTINUOUS DELIVERY</text>
  <g transform="translate(545 305)"><circle cx="18" cy="32" r="12" fill="#f59e0b"/><circle cx="50" cy="12" r="12" fill="#f59e0b"/><circle cx="50" cy="52" r="12" fill="#f59e0b"/><path d="M28 28 42 17M28 36 42 47" stroke="#c2410c" stroke-width="5"/></g><text x="625" y="330" class="h">Azure DevOps</text><text x="625" y="358" class="p">Pipeline trigger and</text><text x="625" y="382" class="p">service connection</text>
  <g transform="translate(545 430)"><rect x="4" y="8" width="56" height="48" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="4"/><path d="M17 24h30M17 38h22" stroke="#d97706" stroke-width="4"/><path d="M32 2v12M25 8l7 7 7-7" fill="none" stroke="#d97706" stroke-width="4"/></g><text x="625" y="455" class="h">Build and release</text><text x="625" y="483" class="p">Test, package and</text><text x="625" y="507" class="p">deploy the function</text>
  <text x="545" y="590" class="micro">DELIVERS THE WORKLOAD</text><text x="545" y="620" class="p">Source change -&gt; build -&gt;</text><text x="545" y="645" class="p">Azure Function deployment</text>

  <g transform="translate(50 0)"><rect x="850" y="150" width="680" height="610" rx="20" fill="#fff" stroke="#67e8f9" stroke-width="3" filter="url(#shadow)"/><rect x="850" y="150" width="680" height="58" rx="20" fill="url(#azure)"/><rect x="850" y="188" width="680" height="20" fill="url(#azure)"/><text x="890" y="187" class="white">AZURE RUNTIME</text><text x="1325" y="187" class="white">PRIVATE NETWORK</text>
  <rect x="890" y="240" width="600" height="140" rx="14" fill="#e6f7fb" stroke="#67e8f9"/><g transform="translate(925 275) scale(.78)"><rect width="75" height="75" rx="14" fill="#087fbd"/><path d="M40 9 20 44h19l-8 26 30-37H41Z" fill="#fff"/></g><text x="1010" y="285" class="h">Azure Function App</text><text x="1010" y="320" class="p">Flex Consumption</text><text x="1010" y="355" class="p">managed identity + VNet + Key Vault access</text>
  <rect x="940" y="405" width="500" height="100" rx="14" fill="#fff7ed" stroke="#fdba74"/><g transform="translate(975 419) scale(.72)"><rect x="4" y="8" width="60" height="50" rx="8" fill="#ea580c"/><path d="M17 45h34M25 45V31M35 45V22M45 45V28" stroke="#fff" stroke-width="5"/></g><text x="1080" y="441" class="h">Private endpoints + DNS</text><text x="1080" y="471" class="p">Blob and Key Vault private DNS zones</text><text x="1080" y="494" class="p">Function identity: storage + Key Vault access</text>
  <rect x="890" y="580" width="292.5" height="170" rx="14" fill="#f0fdf4" stroke="#86efac"/><g transform="translate(925 605) scale(.66)"><ellipse cx="35" cy="12" rx="28" ry="10" fill="#16805b"/><path d="M7 12v42c0 6 13 10 28 10s28-4 28-10V12" fill="#b9e7d2" stroke="#16805b" stroke-width="4"/><ellipse cx="35" cy="54" rx="28" ry="10" fill="#b9e7d2" stroke="#16805b" stroke-width="4"/></g><text x="985" y="617" class="hSmall">Blob</text><text x="985" y="639" class="hSmall">Storage</text><text x="905" y="687" class="p">Function package + data</text><text x="905" y="711" class="p">private access</text>
  <rect x="1197.5" y="580" width="292.5" height="170" rx="14" fill="#fff7ed" stroke="#fdba74"/><g transform="translate(1232.5 605) scale(.66)"><path d="M35 5 61 18v31L35 63 9 49V18Z" fill="#ea580c"/><path d="M22 34h26M28 25h14M28 43h14" stroke="#fff" stroke-width="4"/></g><text x="1292.5" y="617" class="hSmall">Key Vault</text><text x="1212.5" y="687" class="p">Application secrets + identity</text><text x="1212.5" y="711" class="p">private access</text></g>

  <path d="M390 350H500" fill="none" stroke="#087fbd" stroke-width="4" marker-end="url(#blueArrow)"/><text x="405" y="330" class="micro">SOURCE</text><path d="M830 350H890" fill="none" stroke="#d97706" stroke-width="4" marker-end="url(#orangeArrow)"/><text x="805" y="320" class="micro">CODE DEPLOY</text><path d="M1240 380V405" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#orangeArrow)"/><path d="M1240 505V545H1086V570" fill="none" stroke="#16805b" stroke-width="4" marker-end="url(#greenArrow)"/><path d="M1240 505V545H1394V570" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#orangeArrow)"/>
</svg>