<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Terraform modules and private Azure Function App architecture</title>
  <desc id="desc">Terraform modules compose an Azure Function App, virtual network, storage account, Key Vault and monitoring resources. The Function App runs inside a virtual network and reaches Blob Storage and Key Vault through private endpoints and private DNS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf5f1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="11" flood-color="#164e63" flood-opacity=".13"/></filter>
    <marker id="blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#0e7490"/></marker>
    <marker id="green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#16805b"/></marker>
    <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#c2410c"/></marker>
    <style>
      .title { font:700 31px 'Segoe UI',sans-serif; fill:#0f172a; }
      .h { font:700 18px 'Segoe UI',sans-serif; fill:#0f172a; }
      .hSmall { font:700 18px 'Segoe UI',sans-serif; fill:#0f172a; }
      .p { font:400 15px 'Segoe UI',sans-serif; fill:#475569; }
      .tiny { font:700 13px 'Segoe UI',sans-serif; fill:#64748b; letter-spacing:1.5px; }
      .white { font:700 15px 'Segoe UI',sans-serif; fill:#fff; letter-spacing:1.5px; }
      .icon { font:700 24px 'Segoe UI',sans-serif; fill:#fff; text-anchor:middle; }
      .azureLabel { font:700 16px 'Segoe UI',sans-serif; fill:#075985; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1480" cy="70" r="220" fill="#ccebe5" opacity=".6"/><circle cx="80" cy="820" r="170" fill="#d8edf5" opacity=".65"/>
  <text x="70" y="70" class="tiny">TERRAFORM MODULE MAP</text><text x="70" y="117" class="title">Modules Behind the Private Function App Runtime</text><text x="70" y="150" class="p">Reusable Modules Compose the Platform; Azure Resources Connect Inside a Protected Network.</text>

  <rect x="60" y="205" width="300" height="560" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="205" width="300" height="55" rx="18" fill="#334155"/><rect x="60" y="240" width="300" height="20" fill="#334155"/><text x="90" y="241" class="white">TERRAFORM ROOT</text>
  <g transform="translate(102 300)"><polygon points="34,0 64,17 64,51 34,68 4,51 4,17" fill="#7c3aed"/><text x="34" y="44" class="icon">T</text></g><text x="190" y="329" class="h">infra-src/main.tf</text><text x="190" y="356" class="p">Wires Modules</text><text x="190" y="379" class="p">And Relationships</text>
  <text x="95" y="460" class="tiny">MODULES</text><text x="95" y="492" class="p">function-app</text><text x="95" y="518" class="p">virtual-network</text><text x="95" y="544" class="p">application-insight</text><text x="95" y="570" class="p">key-vault</text><text x="95" y="596" class="p">service-plan</text><text x="95" y="622" class="p">storage-account</text>
  <text x="95" y="660" class="tiny">ROOT CONNECTIONS</text><text x="95" y="692" class="p">Private Endpoint</text><text x="95" y="718" class="p">Managed Identity + RBAC</text>

  <rect x="430" y="205" width="330" height="560" rx="18" fill="#fff" stroke="#67e8f9" stroke-width="2" filter="url(#shadow)"/><rect x="430" y="205" width="330" height="55" rx="18" fill="#0e7490"/><rect x="430" y="240" width="330" height="20" fill="#0e7490"/><text x="460" y="241" class="white">REUSABLE MODULES</text>
  <g transform="translate(470 300)"><rect width="66" height="66" rx="15" fill="#087fbd"/><path d="M36 8 18 38h17l-7 22 26-32H37Z" fill="#fff"/></g><text x="560" y="326" class="h">Function App</text><text x="560" y="353" class="p">Runtime + Identity</text>
  <g transform="translate(470 398)"><path d="M33 0 62 17v34L33 68 4 51V17Z" fill="#0ea5e9"/><path d="M15 34h36M22 24h22M22 44h22" stroke="#fff" stroke-width="4"/></g><text x="560" y="424" class="h">Virtual Network</text><text x="560" y="451" class="p">Subnets + NSGs</text>
  <g transform="translate(470 496)"><ellipse cx="33" cy="13" rx="28" ry="10" fill="#16805b"/><path d="M5 13v42c0 6 13 10 28 10s28-4 28-10V13" fill="#b9e7d2" stroke="#16805b" stroke-width="4"/><ellipse cx="33" cy="55" rx="28" ry="10" fill="#b9e7d2" stroke="#16805b" stroke-width="4"/></g><text x="560" y="522" class="h">Storage Account</text><text x="560" y="549" class="p">Blob Containers</text>
  <g transform="translate(470 594)"><rect width="66" height="66" rx="15" fill="#0ea5e9"/><path d="M12 50 28 34l11 9 15-21 10 28Z" fill="#fff"/><circle cx="21" cy="20" r="6" fill="#fff"/></g><text x="560" y="620" class="h">App Insights</text><text x="560" y="647" class="p">Telemetry</text>
  <g transform="translate(470 692)"><path d="M33 0 62 17v34L33 68 4 51V17Z" fill="#ea580c"/><path d="M15 34h36M22 24h22M22 44h22" stroke="#fff" stroke-width="4"/></g><text x="560" y="716" class="h">Key Vault</text><text x="560" y="740" class="p">Secrets + Private Access</text>

  <rect x="830" y="180" width="700" height="600" rx="24" fill="#f3fbff" stroke="#0e7490" stroke-width="3" stroke-dasharray="12 8" filter="url(#shadow)"/><text x="875" y="225" class="azureLabel">AZURE VIRTUAL NETWORK</text><text x="875" y="251" class="p">Function Integration Subnet + Private Endpoint Subnet</text>
  <rect x="1068" y="290" width="220" height="125" rx="16" fill="#e6f7fb" stroke="#67e8f9" stroke-width="2"/><g transform="translate(1088 315)"><rect width="62" height="62" rx="14" fill="#087fbd"/><path d="M34 8 17 37h16l-7 21 24-31H34Z" fill="#fff"/></g><text x="1168" y="330" class="hSmall">Function App</text><text x="1168" y="358" class="p">Inside VNet</text><text x="1168" y="384" class="p">Managed identity</text>
  <rect x="875" y="640" width="270" height="100" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/><g transform="translate(900 660)"><ellipse cx="27" cy="11" rx="22" ry="8" fill="#16805b"/><path d="M5 11v36c0 5 10 8 22 8s22-3 22-8V11" fill="#b9e7d2" stroke="#16805b" stroke-width="3"/><ellipse cx="27" cy="47" rx="22" ry="8" fill="#b9e7d2" stroke="#16805b" stroke-width="3"/></g><text x="970" y="670" class="hSmall">Blob Storage</text><text x="970" y="698" class="p">Private access</text><text x="970" y="724" class="p">Blob endpoint</text>
  <rect x="1210" y="640" width="270" height="100" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><g transform="translate(1235 660)"><path d="M31 4 57 18v31L31 63 5 49V18Z" fill="#ea580c"/><path d="M18 34h26M24 25h14M24 43h14" stroke="#fff" stroke-width="4"/></g><text x="1305" y="670" class="hSmall">Key Vault</text><text x="1305" y="698" class="p">Private access</text><text x="1305" y="724" class="p">Secrets</text>
  <rect x="875" y="450" width="605" height="60" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/><g transform="translate(905 462) scale(.72)"><rect x="5" y="5" width="60" height="52" rx="9" fill="#ea580c"/><path d="M17 42h36M25 42V28M35 42V19M45 42V25" stroke="#fff" stroke-width="5"/></g><text x="995" y="478" class="h">Private Endpoint</text><text x="995" y="502" class="p">Blob + Key Vault private access</text>
  <rect x="875" y="530" width="605" height="60" rx="16" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/><g transform="translate(905 542) scale(.72)"><path d="M35 4 61 18v31L35 63 9 49V18Z" fill="#7c3aed"/><path d="M20 34h30M27 24h16M27 44h16" stroke="#fff" stroke-width="4"/></g><text x="995" y="558" class="h">Shared Private DNS Zone</text><text x="995" y="582" class="p">Blob + Key Vault name resolution</text>
  <path d="M760 333H820" fill="none" stroke="#16805b" stroke-width="4" marker-end="url(#green)"/><path d="M760 438H820" fill="none" stroke="#0e7490" stroke-width="4" marker-end="url(#blue)"/><path d="M760 543H820" fill="none" stroke="#16805b" stroke-width="4" marker-end="url(#green)"/><path d="M760 648H820" fill="none" stroke="#0e7490" stroke-width="4" marker-end="url(#blue)"/>
  <path d="M1178 415V450" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#orange)"/><path d="M1010 590V620H1010V640" fill="none" stroke="#16805b" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#green)"/><path d="M1345 590V620H1345V640" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#orange)"/>
  <text x="70" y="835" class="tiny">RELATIONSHIPS</text><text x="205" y="835" class="p">Modules Create Resources</text><line x1="390" y1="829" x2="445" y2="829" stroke="#16805b" stroke-width="4"/><text x="460" y="835" class="p">Resource</text><line x1="555" y1="829" x2="610" y2="829" stroke="#c2410c" stroke-width="3" stroke-dasharray="8 8"/><text x="625" y="835" class="p">Private Connection</text>
  <text x="70" y="875" class="p">The Function App Runs Inside the VNet And Reaches Storage and Key Vault Through Private Endpoints Resolved by Private DNS.</text>
